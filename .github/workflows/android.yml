name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install JS deps
        working-directory: android-app
        run: npm ci || npm install

      - name: Copy web app into www
        working-directory: android-app
        run: |
          cp ../index.html ../manifest.webmanifest ../sw.js www/ 2>/dev/null || true
          rm -rf www/icons && cp -r ../icons www/icons 2>/dev/null || true

      - name: Capacitor sync
        working-directory: android-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Wellora.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wellora (latest build)
          body: "Auto-built Android APK. Install and allow 'unknown sources'. App features update automatically from the web."
          files: Wellora.apk
