# Netlify config for Wellora — static PWA served from the repo root.
[build]
  publish = "."

# Always revalidate the service worker so updates reach installed apps fast.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
