<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0f6e63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1512" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wellora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Wellora</title>
<meta name="description" content="Wellora By Adesh — personal Indian health & nutrition tracker">
<style>
  html{-webkit-text-size-adjust:100%;color-scheme:light dark}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f4f7f4; --border:#dce4df;
  --ink:#14231f; --ink-soft:#4d5e58; --ink-faint:#7d8d87;
  --primary:#0f6e63; --primary-soft:#d5eae5; --primary-ink:#0a473f;
  --accent:#e0812f; --accent-soft:#fbe6cf;
  --good:#2f9e6b; --good-soft:#d7efe2;
  --warn:#d99a17; --warn-soft:#faeccb;
  --bad:#d95948; --bad-soft:#f8ddd7;
  --info:#3b7dd8; --info-soft:#dbe8fb;
  --ring-track:#e6ece9;
  --shadow:0 1px 2px rgba(20,35,31,.05),0 8px 24px -12px rgba(20,35,31,.18);
  --shadow-sm:0 1px 2px rgba(20,35,31,.06);
  --r:16px; --r-sm:11px;
  --nav-h:64px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:'Bricolage Grotesque',var(--font);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0d1512; --surface:#16211d; --surface-2:#1c2925; --border:#2a3833;
    --ink:#e8f0ec; --ink-soft:#a9b8b2; --ink-faint:#7a8a84;
    --primary:#3fb8a6; --primary-soft:#153029; --primary-ink:#8fe6d8;
    --accent:#f0a05a; --accent-soft:#3a2a17;
    --good:#4cc088; --good-soft:#153427;
    --warn:#e6b23e; --warn-soft:#352a12;
    --bad:#ec7361; --bad-soft:#38201c;
    --info:#67a0ec; --info-soft:#182739;
    --ring-track:#26332e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#16211d; --surface-2:#1c2925; --border:#2a3833;
  --ink:#e8f0ec; --ink-soft:#a9b8b2; --ink-faint:#7a8a84;
  --primary:#3fb8a6; --primary-soft:#153029; --primary-ink:#8fe6d8;
  --accent:#f0a05a; --accent-soft:#3a2a17;
  --good:#4cc088; --good-soft:#153427;
  --warn:#e6b23e; --warn-soft:#352a12;
  --bad:#ec7361; --bad-soft:#38201c;
  --info:#67a0ec; --info-soft:#182739;
  --ring-track:#26332e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}
::placeholder{color:var(--ink-faint)}

/* ---- shell ---- */
.app{max-width:1040px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-left)) calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);
  padding:14px 0 10px;display:flex;align-items:center;gap:12px;}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--primary),#12876f);
  display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--shadow-sm)}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--ink-faint);margin-top:-2px;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--ink-soft);flex:none;box-shadow:var(--shadow-sm)}
.icon-btn:hover{color:var(--primary)}
.icon-btn svg{width:19px;height:19px}
.profile-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:5px 12px 5px 5px;box-shadow:var(--shadow-sm);max-width:190px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:var(--display)}
.profile-chip .pname{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-chip svg{width:15px;height:15px;color:var(--ink-faint);flex:none}

main{flex:1;padding-top:6px}
.tab-pane{display:none;animation:fade .25s ease}
.tab-pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- nav ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:1040px;margin:0 auto;height:var(--nav-h);display:flex;padding:0 8px}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-faint);font-size:11px;font-weight:700;border-radius:12px;transition:color .15s}
.tab-btn svg{width:23px;height:23px}
.tab-btn.active{color:var(--primary)}
.tab-btn.active .tb-ic{background:var(--primary-soft)}
.tb-ic{width:52px;height:30px;border-radius:16px;display:grid;place-items:center;transition:background .18s}

/* ---- generic cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.section-title{display:flex;align-items:center;gap:8px;margin:22px 0 12px;font-size:13px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.section-title .line{height:1px;background:var(--border);flex:1}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.pri{background:var(--primary-soft);color:var(--primary-ink)}

/* ---- hero / dashboard ---- */
.hero{background:linear-gradient(150deg,var(--primary),#0c5a50);color:#eafaf6;border:none}
.hero h2{color:#fff}
.hero .sub{color:#b9e2da}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.hero .goaltag{background:rgba(255,255,255,.16);color:#fff;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700}
.progress-line{height:9px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.progress-line>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f4b06a);border-radius:6px}
.wl-row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:#d3efe8;font-weight:600}
.wl-row b{color:#fff}

.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.rings{grid-template-columns:repeat(2,1fr)}}
.ring-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.ring-wrap{position:relative;width:84px;height:84px;margin:0 auto 6px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring-center b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.ring-center small{font-size:10px;color:var(--ink-faint);font-weight:700}
.ring-label{font-size:12px;font-weight:700;color:var(--ink-soft)}
.ring-sub{font-size:11px;color:var(--ink-faint);font-weight:600}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.stat-grid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.stat .k{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-family:var(--display);font-size:23px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:12px;font-weight:600;color:var(--ink-faint);font-family:var(--font)}

/* BMI meter */
.bmi-meter{height:12px;border-radius:8px;margin:14px 0 6px;position:relative;
  background:linear-gradient(90deg,#3b7dd8 0 22%,#2f9e6b 22% 40%,#d99a17 40% 60%,#e0812f 60% 78%,#d95948 78% 100%)}
.bmi-knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);
  transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.bmi-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;
  font-weight:700;font-size:14px;background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.btn.accent{background:var(--accent)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn svg{width:17px;height:17px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.input,select.input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-soft);min-width:70px}
.seg button.on{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}

/* food diary */
.meal-block{margin-bottom:14px}
.meal-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.meal-head .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.meal-head b{font-size:14px}
.meal-head .kc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.food-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.food-item:first-child{border-top:none}
.food-item .fn{font-weight:600;font-size:14px}
.food-item .fm{font-size:11px;color:var(--ink-faint);font-weight:600}
.food-item .fk{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.food-item .del{color:var(--ink-faint);width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.food-item .del:hover{color:var(--bad);background:var(--bad-soft)}
.add-food{display:flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:13px;padding:8px 0}
.add-food svg{width:17px;height:17px}
.macro-bar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:4px;background:var(--surface-2)}
.macro-bar i{display:block;height:100%}

/* tracker rows */
.track-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.track-row:first-child{border-top:none}
.track-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.track-ic svg{width:20px;height:20px}
.track-row .tl{font-weight:700;font-size:14px}
.track-row .ts{font-size:12px;color:var(--ink-faint);font-weight:600}
.track-row .tv{margin-left:auto;display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.stepper button{width:34px;height:36px;font-size:18px;font-weight:700;color:var(--primary);display:grid;place-items:center}
.stepper input{width:56px;text-align:center;border:none;background:transparent;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.stepper.wide input{width:72px}

/* checklist */
.check{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border);cursor:pointer}
.check:first-child{border-top:none}
.check .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex:none;display:grid;place-items:center;transition:.15s}
.check .box svg{width:15px;height:15px;color:#fff;opacity:0}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box svg{opacity:1}
.check.on .ctxt{color:var(--ink-faint);text-decoration:line-through}
.ctxt{font-weight:600;font-size:14px}

/* charts */
.chart-wrap{overflow-x:auto}
svg.chart text{fill:var(--ink-faint);font-family:var(--font);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* meal plan */
.day-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.day-tab{flex:none;padding:9px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
  font-weight:700;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow-sm)}
.day-tab.on{background:var(--primary);color:#fff;border-color:transparent}
.plan-meal{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.plan-meal:first-child{border-top:none}
.plan-meal .pm-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.plan-meal .pm-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint)}
.plan-meal .pm-d{font-weight:600;font-size:14px;margin-top:1px}
.seed-note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;
  color:var(--ink);display:flex;gap:10px;align-items:center}
.seed-note .s-ic{font-size:20px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,20,17,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:auto}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
@media(min-width:640px){.modal{border-radius:20px;transform:translateY(20px)}}
.modal-bg.show .modal{transform:none}
.modal h3{font-size:19px;margin-bottom:4px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-close{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft)}
.chip-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fchip{padding:8px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  font-size:13px;font-weight:700;display:flex;flex-direction:column;line-height:1.15}
.fchip small{font-weight:600;color:var(--ink-faint);font-size:10px}
.fchip:hover{border-color:var(--primary);color:var(--primary)}
.search-list{max-height:230px;overflow-y:auto;margin-top:8px}
.sr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;cursor:pointer}
.sr:hover{background:var(--surface-2)}
.sr .srn{font-weight:700;font-size:14px}
.sr .srm{font-size:11px;color:var(--ink-faint);font-weight:600}
.sr .srk{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:26px 16px;color:var(--ink-faint)}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:24px;font-weight:700;font-size:13px;z-index:200;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}
.toast.show{opacity:1}
.sample-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--warn);
  background:var(--warn-soft);padding:3px 9px;border-radius:20px}
.disclaimer{font-size:11.5px;color:var(--ink-faint);line-height:1.5;margin-top:10px;padding:11px 13px;
  background:var(--surface-2);border-radius:11px;border:1px solid var(--border)}
a.link{color:var(--primary);font-weight:700;text-decoration:none}

/* ===== Wellora polish layer ===== */
.card{transition:box-shadow .22s ease,transform .22s ease}
.tab-pane.active .card{animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.tab-pane.active .rings>*{animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.tab-pane.active .rings>*:nth-child(1){animation-delay:.02s}
.tab-pane.active .rings>*:nth-child(2){animation-delay:.08s}
.tab-pane.active .rings>*:nth-child(3){animation-delay:.14s}
.tab-pane.active .rings>*:nth-child(4){animation-delay:.20s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.ring-card{transition:transform .2s ease,box-shadow .2s ease}
.ring-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ring-wrap svg circle:last-of-type{transition:stroke-dashoffset 1s cubic-bezier(.34,1.05,.4,1)}
.ring-center b{letter-spacing:-.02em}

.btn{transition:filter .15s ease,transform .12s ease,box-shadow .15s ease}
.btn:hover{box-shadow:var(--shadow)}
.btn:active,.icon-btn:active,.day-tab:active,.fchip:active,.stepper button:active,.tab-btn:active{transform:translateY(1px) scale(.97)}
.icon-btn,.day-tab,.fchip,.profile-chip{transition:transform .12s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
.profile-chip:hover{box-shadow:var(--shadow)}
.tb-ic svg{transition:transform .22s cubic-bezier(.34,1.4,.5,1)}
.tab-btn.active .tb-ic svg{transform:scale(1.12)}

.hero{position:relative;overflow:hidden}

@keyframes splashRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

function freshDB(){return {profiles:[],active:null,logs:{},theme:null,planDay:null};}

/* ---------- profile / log helpers ---------- */
function P(){return DB.profiles.find(p=>p.id===DB.active)||DB.profiles[0];}
function logsFor(pid){if(!DB.logs[pid])DB.logs[pid]={};return DB.logs[pid];}
function dayLog(pid,key){const L=logsFor(pid);if(!L[key])L[key]={foods:[],water:0,steps:0,exercise:0,weight:null,sleep:0,habits:{}};
 const d=L[key];d.foods=d.foods||[];d.habits=d.habits||{};return d;}
function today(){return dayLog(DB.active,todayKey());}

function bmr(p,wt){const s=p.sex==='male'?5:-161;return 10*wt+6.25*p.height-5*p.age+s;}
function currentWeight(pid){const L=logsFor(pid);const keys=Object.keys(L).filter(k=>L[k].weight!=null).sort();
 if(keys.length)return L[keys[keys.length-1]].weight;
 const p=(DB.profiles||[]).find(x=>x.id===pid)||P();return p?p.startWeight:70;}
function bmiVal(wt,h){return wt/((h/100)**2);}
function bmiCat(b){ // Asian-Indian cutoffs
 if(b<18.5)return{t:'Underweight',c:'info',p:(b/18.5)*22};
 if(b<23)return{t:'Healthy',c:'good',p:22+((b-18.5)/4.5)*18};
 if(b<25)return{t:'Overweight',c:'warn',p:40+((b-23)/2)*20};
 if(b<30)return{t:'Obese I',c:'bad',p:60+((b-25)/5)*18};
 return{t:'Obese II',c:'bad',p:clamp(78+((b-30)/5)*22,78,100)};}

function computeTargets(p){
 const L=logsFor(p.id);const ks=Object.keys(L).filter(k=>L[k].weight!=null).sort();
 const wt=ks.length?L[ks[ks.length-1]].weight:(p.startWeight||70);
 const tdee=bmr(p,wt)*p.activity;
 let cal,pf;
 if(p.goal==='lose'){cal=tdee-500;pf=1.9;}
 else if(p.goal==='gain'){cal=tdee+350;pf=1.8;}
 else if(p.goal==='strength'){cal=tdee+150;pf=2.0;}
 else {cal=tdee;pf=1.7;}
 // condition-aware adjustments (higher protein, lower-carb for PCOS/diabetes)
 const cond=p.condition||'none';
 if(cond==='pcos'||cond==='diabetes')pf=Math.max(pf,2.0);
 const fatPct=(cond==='pcos'||cond==='diabetes')?0.32:0.27;
 cal=Math.max(1200,Math.round(cal/10)*10);
 const protein=Math.round(wt*pf);
 const fat=Math.round(cal*fatPct/9);
 const carb=Math.round((cal-protein*4-fat*9)/4);
 const fiber=Math.round(cal/1000*(cond==='diabetes'||cond==='pcos'?16:14));
 return {cal,protein,carb,fat,fiber,water:Math.round(wt*35/50)*50,
   steps:p.goal==='gain'?7000:9000,sleep:8};
}
function activeTargets(p){return p.autoTargets?computeTargets(p):p.targets;}

function dayTotals(d){let kc=0,p=0,c=0,f=0;(d.foods||[]).forEach(x=>{kc+=x.kc;p+=x.p;c+=x.c;f+=x.f;});
 return {kc:Math.round(kc),p:Math.round(p),c:Math.round(c),f:Math.round(f)};}

function ringSVG(pct,color,size=84){
 const r=(size-12)/2, C=2*Math.PI*r, off=C*(1-clamp(pct,0,1));
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="9"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
   stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}
function ringCard(label,val,unit,pct,color,sub){
 return `<div class="ring-card"><div class="ring-wrap">${ringSVG(pct,color)}
   <div class="ring-center"><b class="tnum">${val}</b><small>${unit}</small></div></div>
   <div class="ring-label">${label}</div><div class="ring-sub tnum">${sub}</div></div>`;
}

function animateDash(){
 const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 document.querySelectorAll('#pane-dash .ring-card').forEach(card=>{
   const circ=card.querySelector('svg circle:last-of-type');
   if(circ&&!rm){
     const off=circ.getAttribute('stroke-dashoffset'), dash=circ.getAttribute('stroke-dasharray');
     circ.style.transition='none';circ.setAttribute('stroke-dashoffset',dash);
     requestAnimationFrame(()=>requestAnimationFrame(()=>{circ.style.transition='';circ.setAttribute('stroke-dashoffset',off);}));
   }
 });
 if(rm)return;
 document.querySelectorAll('#pane-dash .ring-center b').forEach(countUp);
}
function countUp(node){
 const raw=node.textContent.trim();
 const num=parseFloat(raw.replace(/[^\d.-]/g,''));
 if(isNaN(num)||num===0){return;}
 const suffix=raw.replace(/[\d.\-]/g,'');
 const dec=(raw.split('.')[1]||'').replace(/\D/g,'').length;
 const dur=750,t0=performance.now();
 function step(t){
   const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
   node.textContent=(num*e).toFixed(dec)+suffix;
   if(p<1)requestAnimationFrame(step); else node.textContent=raw;
 }
 requestAnimationFrame(step);
}

function trackRow(emoji,title,sub,field,val,step,bg,col,unit){

function shiftLog(n){const nd=addDays(parseKey(logDate),n);if(nd>new Date())return;logDate=fmtKey(nd);renderLog();}
function setNum(field,delta){const d=dayLog(P().id,logDate);
 if(field==='weight'){let v=(d.weight!=null?d.weight:currentWeight(P().id));v=round(clamp(v+delta,20,300),1);d.weight=v;}
 else if(field==='sleep'){d.sleep=round(clamp((d.sleep||0)+delta,0,16),1);}
 else{d[field]=Math.max(0,(d[field]||0)+delta);}
 delete d.sample;save();renderLog();
}
function setFieldInput(field,v){const d=dayLog(P().id,logDate);d[field]=Math.max(0,Math.round(+v||0));delete d.sample;save();renderLog();}
function setWeightInput(v){const d=dayLog(P().id,logDate);d.weight=v===''?null:round(clamp(+v||0,20,300),1);delete d.sample;save();renderLog();}
function setSleepInput(v){const d=dayLog(P().id,logDate);d.sleep=round(clamp(+v||0,0,16),1);delete d.sample;save();renderLog();}
function toggleHabit(i){const d=dayLog(P().id,logDate);d.habits[i]=!d.habits[i];delete d.sample;save();renderLog();}
function delFood(id){const d=dayLog(P().id,logDate);d.foods=d.foods.filter(f=>f.id!==id);save();renderLog();if(cur==='dash')renderDash();}

/* ---------- pedometer (device motion, foreground only) ---------- */
let ped={active:false,filt:9.8,lastStep:0,acc:0};
function togglePed(){ped.active?pedStop():pedStart();}
function pedStart(){
 const begin=()=>{ped.active=true;ped.filt=9.8;ped.lastStep=0;window.addEventListener('devicemotion',pedHandler);renderLog();toast('Step counter on 👟');};
 if(typeof DeviceMotionEvent==='undefined')return toast('No motion sensor on this device');
 if(typeof DeviceMotionEvent.requestPermission==='function'){
   DeviceMotionEvent.requestPermission().then(s=>s==='granted'?begin():toast('Motion permission denied')).catch(()=>toast('Motion not available'));
 } else begin();
}
function pedStop(){ped.active=false;window.removeEventListener('devicemotion',pedHandler);if(ped.acc){savePedSteps();}renderLog();toast('Step counter off');}
function pedHandler(e){
 const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
 const mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
 ped.filt=ped.filt*0.9+mag*0.1;
 const dyn=mag-ped.filt,now=Date.now();
 if(dyn>1.15&&now-ped.lastStep>280){ped.lastStep=now;pedStep();}
}
function pedStep(){
 const d=dayLog(P().id,todayKey());d.steps=(d.steps||0)+1;ped.acc++;
 const el=document.getElementById('stepLive');if(el)el.textContent=d.steps;
 const inp=document.getElementById('in-steps');if(inp)inp.value=d.steps;
 if(ped.acc>=10)savePedSteps();
}
function savePedSteps(){ped.acc=0;delete dayLog(P().id,todayKey()).sample;save();}

/* ---------- 📷 scan food (on-device AI) ---------- */
/* Maps common recognized labels to Wellora's food library. */
const SCAN_MAP={
 'banana':'Banana','orange':'Orange / mosambi','pineapple':'Pineapple','pomegranate':'Pomegranate (dalimb)',
 'granny smith':'Apple','apple':'Apple','fig':'Anjeer (fig, dry)','lemon':'Amla juice (shot)',
 'broccoli':'Broccoli (steamed)','cauliflower':'Flower (cauliflower) bhaji','cucumber':'Cucumber (kakdi)',
 'bell pepper':'Bell pepper (raw)','mushroom':'Mushroom (raw)','corn':'Sweet corn (makai)','ear':'Sweet corn (makai)',
 'cabbage':'Kobi (cabbage) bhaji','zucchini':'Dudhi (bottle gourd) bhaji','mashed potato':'Batatyachi bhaji (potato)',
 'pizza':'Pizza (slice)','cheeseburger':'Veg burger','hamburger':'Veg burger','bagel':'Bread (2 slices)',
 'pretzel':'Khakhra','ice cream':'Ice cream','ice lolly':'Ice cream','espresso':'Black coffee / green tea',
 'guacamole':'Kachumber salad','burrito':'Frankie / veg roll','spaghetti':'Maggi noodles','carbonara':'Maggi noodles',
 'french loaf':'Bread (2 slices)','meat loaf':'Chicken keema','dough':'Chapati / poli','trifle':'Shrikhand',
 'consomme':'Chicken soup','hotpot':'Dal makhani','plate':null,'soup bowl':'Varan / toor dal','mixing bowl':null,
};
function matchFoodIdx(label){
 label=(label||'').toLowerCase();
 for(const k in SCAN_MAP){if(label.includes(k)){const n=SCAN_MAP[k];if(!n)return -1;const i=FOODS.findIndex(f=>f.n===n);if(i>=0)return i;}}
 for(const w of label.split(/[ ,]+/)){if(w.length<4)continue;const i=FOODS.findIndex(f=>f.n.toLowerCase().includes(w));if(i>=0)return i;}
 return -1;
}
let _clf=null;
async function loadClassifier(onprog){
 if(_clf)return _clf;
 const t=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
 t.env.allowLocalModels=false;t.env.useBrowserCache=true;
 _clf=await t.pipeline('image-classification','Xenova/vit-base-patch16-224',{progress_callback:onprog});
 return _clf;
}
function openScan(){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
 inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)scanImage(f);};
 inp.click();
}
async function scanImage(file){
 const url=URL.createObjectURL(file);
 openModal(`<div class="modal-head"><h3>📷 Scan food</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
   <img src="${url}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:12px">
   <div id="scanStatus" style="text-align:center;padding:14px"><div class="faint" style="font-weight:700">Analysing on your device…<div id="scanNote" style="font-weight:500;margin-top:4px">first time downloads the AI once</div></div></div>
   <div id="scanResults"></div>`);
 try{
   const clf=await loadClassifier(x=>{const n=document.getElementById('scanNote');if(n&&x&&x.status==='progress')n.textContent='downloading model '+Math.round(x.progress||0)+'%';});
   const out=await clf(url,{topk:6});
   showScanResults(out||[]);
 }catch(e){
   const s=document.getElementById('scanStatus');if(s)s.innerHTML=`<div class="faint" style="margin-bottom:10px">On-device recognition isn't available here (needs Chrome/Android and the live app). You can still add the food by searching.</div><button class="btn block" onclick="closeModal();openAddFood('l')">Search food instead</button>`;
 } finally { setTimeout(()=>URL.revokeObjectURL(url),5000); }
}
function scanRow(idx,conf){const f=FOODS[idx];return `<div class="sr" onclick="scanPick(${idx})"><span style="font-size:20px">${CATEMOJI[f.cat]}</span><div style="min-width:0"><div class="srn">${esc(f.n)}</div><div class="srm">${esc(f.u)} · ${f.kc} kcal</div></div>${conf!=null?`<span class="srk tnum">${Math.round(conf*100)}%</span>`:''}</div>`;}
function showScanResults(out){
 const seen={},matches=[];
 out.forEach(o=>{const i=matchFoodIdx(o.label);if(i>=0&&!seen[i]){seen[i]=1;matches.push([i,o.score]);}});
 const st=document.getElementById('scanStatus');if(st)st.style.display='none';
 let h='';
 if(matches.length){h+=`<div class="faint" style="font-weight:700;margin-bottom:8px">Best matches — tap the right one:</div>${matches.map(m=>scanRow(m[0],m[1])).join('')}`;}
 else{h+=`<div class="faint" style="margin-bottom:8px">Couldn't confidently recognise this dish (Indian dishes are tricky) — search for it:</div>`;}
 h+=`<div style="margin-top:10px"><input class="input" id="scanSearch" placeholder="Search Wellora foods…" oninput="scanFilter(this.value)" autocomplete="off"><div class="search-list" id="scanSearchList"></div></div>

}

 const el=document.getElementById('scanSearchList');if(el)el.innerHTML=list.map(([f,i])=>scanRow(i,null)).join('');}

function scanConfirm(){const f=FOODS[scanFoodIdx];addSlot=scanSlot;logDate=todayKey();

/* ---------- NUTRIENTS (micronutrients) ---------- */
function dayMicros(d){
 const tot={};NUTRIENTS.forEach(n=>tot[n.k]=0);
 (d.foods||[]).forEach(f=>{const m=MICRO[f.n];if(!m)return;const q=f.qty||1;
   for(const k in m)if(k in tot)tot[k]+=m[k]*q;});
 return tot;
}
function microRda(n,t){return n.k==='fib'?(t.fiber||32):n.rda;}
function microCovered(mic,t){return NUTRIENTS.filter(n=>mic[n.k]/microRda(n,t)>=0.7).length;}
function fmtMicro(v){return v>=100?Math.round(v):v>=10?Math.round(v):round(v,1);}
function renderNutrients(){
 const p=P(),t=activeTargets(p),d=today();
 const mic=dayMicros(d);
 const covered=microCovered(mic,t);
 const strong=NUTRIENTS.filter(n=>mic[n.k]/microRda(n,t)>=1).length;
 const unrec=(d.foods||[]).filter(f=>!MICRO[f.n]).length;

 let h=`<div class="section-title" style="margin-top:14px">Micronutrients today<span class="line"></span>
   <span class="pill ${covered>=11?'good':covered>=7?'warn':'bad'}">${covered}/${NUTRIENTS.length} on track</span></div>`;
 h+=`<div class="card"><div style="display:flex;gap:15px;align-items:center">
   <div class="ring-wrap" style="width:78px;height:78px;flex:none">${ringSVG(covered/NUTRIENTS.length,'var(--primary)',78)}
     <div class="ring-center"><b class="tnum" style="font-size:18px">${covered}</b><small>/${NUTRIENTS.length}</small></div></div>
   <div><div style="font-family:var(--display);font-weight:800;font-size:17px">${strong} fully met · ${covered} on track</div>
   <div class="faint" style="font-size:13px;font-weight:600;margin-top:2px">Estimated from today's logged foods, vs daily targets. Aim to cover most across the week.</div></div></div>`;

 ['Vitamins','Minerals','Fats & fiber'].forEach(g=>{
   h+=`<div class="section-title">${g}<span class="line"></span></div><div class="card">`;
   NUTRIENTS.filter(n=>n.g===g).forEach(n=>{
     const have=mic[n.k],need=microRda(n,t),r=need?have/need:0;
     const col=r>=0.7?'var(--good)':r>=0.4?'var(--warn)':'var(--bad)';
     h+=`<div class="nutri-row"><div class="nutri-top"><b>${n.n}</b>
        <span class="tnum">${fmtMicro(have)} / ${fmtMicro(need)} ${n.u} · ${Math.round(r*100)}%</span></div>
       <div class="nbar"><i style="width:${clamp(r*100,0,100)}%;background:${col}"></i></div>
       <div class="nutri-src faint">Best from: ${n.src}</div></div>`;
   });
   h+=`</div>`;
 });
 if(unrec)h+=`<div class="disclaimer">${unrec} logged item${unrec>1?'s':''} (custom or planned meals) have no micronutrient estimate yet, so they're not counted above — log them from the food search to include their nutrients.</div>`;
 h+=`<div class="disclaimer">🔬 Micronutrient amounts are practical per-serving estimates from each dish's main ingredients — for coverage awareness, not lab-exact values. A varied weekly diet is the goal, not hitting every number every day. Deficiencies (e.g. vitamin&nbsp;D, B12) need a clinician.</div>`;
 $('#pane-nutri').innerHTML=h;
 requestAnimationFrame(()=>{
   if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
   document.querySelectorAll('#pane-nutri .nbar i').forEach(i=>{const w=i.style.width;i.style.width='0';
     requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.transition='width .8s cubic-bezier(.2,.8,.2,1)';i.style.width=w;}));});
 });
}

 if(wpts.length<2){
   h+=`<div class="card empty"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V5M4 19h16M8 14l3-3 3 2 4-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <div style="font-weight:700;color:var(--ink)">Log a few weigh-ins</div><div>Record your morning weight for a few days to see the trend.</div></div>`;

       <div class="stat"><div class="k">Change</div><div class="v tnum" style="color:${delta<=0?'var(--good)':'var(--bad)'}">${delta<=0?'−':'+'}${round(Math.abs(delta),1)}<small>kg</small></div></div>
     </div>
     <div class="chart-wrap">${lineChart(wpts,p.goalWeight)}</div>
   </div>`;
 }

 // calories in vs out (last 7 logged days)

 h+=`<div class="card"><div class="chart-wrap">${calChart(p,L)}</div>
   <div class="legend"><span><i style="background:var(--accent)"></i>Eaten</span><span><i style="background:var(--good)"></i>Exercise burn</span><span><i style="width:16px;height:3px;border-radius:2px;background:var(--ink-soft)"></i>Target</span></div></div>`;

 // averages card (last 7 days macros/steps/water)
 const days=lastNDays(7);
 let sK=0,sP=0,sSt=0,sW=0,n=0,nSt=0,nW=0;
 days.forEach(k=>{const d=L[k];if(!d)return;const t=dayTotals(d);if(t.kc>0){sK+=t.kc;sP+=t.p;n++;}if(d.steps){sSt+=d.steps;nSt++;}if(d.water){sW+=d.water;nW++;}});
 h+=`<div class="section-title">7-day averages<span class="line"></span></div>
   <div class="card"><div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="k">Calories</div><div class="v tnum">${n?Math.round(sK/n):'–'}</div></div>
    <div class="stat"><div class="k">Protein</div><div class="v tnum">${n?Math.round(sP/n):'–'}<small>g</small></div></div>
    <div class="stat"><div class="k">Steps</div><div class="v tnum">${nSt?fmtK(Math.round(sSt/nSt)):'–'}</div></div>
    <div class="stat"><div class="k">Water</div><div class="v tnum">${nW?round(sW/nW/1000,1):'–'}<small>L</small></div></div>
   </div>
   <div class="faint" style="font-size:12px;margin-top:10px">Based on days you logged in the last week.</div></div>`;

 $('#pane-progress').innerHTML=h;
}
function lastNDays(n){const a=[];for(let i=n-1;i>=0;i--)a.push(fmtKey(addDays(new Date(),-i)));return a;}
function lineChart(pts,goal){
 const W=Math.max(320,pts.length*46),H=200,pad={l:34,r:14,t:16,b:26};
 const xs=pts.map(p=>p.x.getTime());
 const minX=Math.min(...xs),maxX=Math.max(...xs);
 const ws=pts.map(p=>p.w).concat([goal]);
 let minW=Math.min(...ws)-0.6,maxW=Math.max(...ws)+0.6;
 const X=t=>pad.l+(maxX===minX?0.5:(t-minX)/(maxX-minX))*(W-pad.l-pad.r);
 const Y=w=>pad.t+(1-(w-minW)/(maxW-minW))*(H-pad.t-pad.b);
 let g='';
 // gridlines
 for(let i=0;i<=3;i++){const w=minW+(maxW-minW)*i/3,y=Y(w);
   g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
   <text x="4" y="${y+4}" font-size="10">${round(w,1)}</text>`;}
 // goal line
 const gy=Y(goal);g+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="${W-pad.r}" y="${gy-5}" font-size="10" text-anchor="end" fill="var(--accent)">goal ${goal}</text>`;
 // area + line
 const dpath=pts.map((p,i)=>(i?'L':'M')+X(p.x.getTime()).toFixed(1)+' '+Y(p.w).toFixed(1)).join(' ');
 const area=dpath+` L ${X(maxX).toFixed(1)} ${H-pad.b} L ${X(minX).toFixed(1)} ${H-pad.b} Z`;
 g+=`<path d="${area}" fill="var(--primary-soft)" opacity=".6"/><path d="${dpath}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>{const last=i===pts.length-1;
   g+=`<circle cx="${X(p.x.getTime())}" cy="${Y(p.w)}" r="${last?4.5:3}" fill="${last?'var(--primary)':'var(--surface)'}" stroke="var(--primary)" stroke-width="2"/>`;
   if(i===0||last||i===pts.length-1)g+=`<text x="${X(p.x.getTime())}" y="${H-8}" font-size="9" text-anchor="middle">${p.x.getDate()}/${p.x.getMonth()+1}</text>`;});
 return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function calChart(p,L){
 const t=activeTargets(p);const days=lastNDays(7);
 const rows=days.map(k=>{const d=L[k]||{};return{k,eaten:dayTotals(d).kc,burn:d.exercise||0,x:parseKey(k)};});
 const W=Math.max(320,days.length*44),H=190,pad={l:34,r:12,t:14,b:26};
 const maxV=Math.max(t.cal*1.15,...rows.map(r=>r.eaten),1);
 const Y=v=>pad.t+(1-v/maxV)*(H-pad.t-pad.b);
 const bw=(W-pad.l-pad.r)/days.length*0.5;
 let g='';
 for(let i=0;i<=2;i++){const v=maxV*i/2,y=Y(v);g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)"/><text x="4" y="${y+4}" font-size="10">${Math.round(v)}</text>`;}
 const ty=Y(t.cal);g+=`<line x1="${pad.l}" y1="${ty}" x2="${W-pad.r}" y2="${ty}" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
 rows.forEach((r,i)=>{const cx=pad.l+(i+0.5)*((W-pad.l-pad.r)/days.length);
   const y=Y(r.eaten),bh=(H-pad.b)-y;

   if(r.eaten>0)g+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="3" fill="${col}"/>`;
   if(r.burn>0){const by=Y(r.burn);g+=`<rect x="${cx-bw/2}" y="${by}" width="${bw}" height="${(H-pad.b)-by}" rx="3" fill="var(--good)" opacity=".55"/>`;}
   g+=`<text x="${cx}" y="${H-8}" font-size="9" text-anchor="middle">${DOW[r.x.getDay()]}</text>`;});
 return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;

function foodByName(n){return FOODS.find(f=>f.n===n);}
function mkEntry(name,qty){const f=foodByName(name);if(!f)return null;
 qty=clamp(Math.round(qty*2)/2,0.5,4);
 return {n:name,qty,kc:Math.round(f.kc*qty),p:round(f.p*qty,1),c:round(f.c*qty,1),f:round(f.f*qty,1)};}
function scaleTo(name,budget){const f=foodByName(name);return f?mkEntry(name,budget/f.kc):null;}
function mealKc(items){return items.reduce((s,x)=>s+(x?x.kc:0),0);}
function pk(a,i){return a[i%a.length];}
function reKc(e){const f=foodByName(e.n);e.kc=Math.round(f.kc*e.qty);e.p=round(f.p*e.qty,1);e.c=round(f.c*e.qty,1);e.f=round(f.f*e.qty,1);return e;}
function nudge(e,dkc){const f=foodByName(e.n);e.qty=clamp(Math.round((e.qty+dkc/f.kc)*2)/2,0.5,4);reKc(e);}
function generateWeek(p){
 const t=activeTargets(p),cal=t.cal,diet=p.diet||'veg';
 const cond=p.condition||'none', lowGI=(cond==='pcos'||cond==='diabetes');
 const fruitPool=lowGI?['Guava','Apple','Orange / mosambi','Pomegranate (dalimb)','Papaya']:GEN.fruits;
 const meals={};
 GEN_DAYS.forEach((day,i)=>{
   const bB=cal*GEN.split.b,bL=cal*GEN.split.l,bD=cal*GEN.split.d;
   // low-GI: prefer millet bhakri (jowar/bajra/ragi) over wheat/rice
   const breadPool=lowGI?['Jowar bhakri','Bajra bhakri','Nachni (ragi) bhakri']:GEN.breads;
   const bf=[scaleTo(pk(GEN.breakfast,i),bB*0.6)];
   if(diet!=='veg')bf.push(mkEntry(pk(GEN.bfProtein,i),1));
   bf.push(mkEntry(pk(GEN.bfDairy,i),diet==='veg'?1:0.75));
   const sn=[mkEntry(pk(fruitPool,i),1),mkEntry(pk(GEN.seeds,i),1.5)];
   const ln=[scaleTo(pk(breadPool,i),bL*0.42),mkEntry(pk(GEN.dals,i),1),mkEntry(pk(GEN.veg,i),1),mkEntry(pk(GEN.sides,i),1)];
   let dn;
   if(diet==='veg'){dn=[scaleTo(pk(GEN.dinnerVeg,i),bD*0.5),mkEntry(pk(['Paneer','Tofu','Rajma masala','Chana (chickpea) usal'],i),0.75),mkEntry(pk(GEN.veg,i+3),1)];}
   else{dn=[mkEntry(pk(GEN.protein[diet],i),1),scaleTo(lowGI?pk(breadPool,i+2):(i%2?GEN.rice:pk(GEN.breads,i+2)),bD*0.32),mkEntry(pk(GEN.veg,i+5),1)];}
   const M={b:bf.filter(Boolean),s:sn.filter(Boolean),l:ln.filter(Boolean),d:dn.filter(Boolean)};
   // normalize daily total toward calorie target via flex starch/main items
   let total=['b','s','l','d'].reduce((a,k)=>a+mealKc(M[k]),0),guard=0;
   const flex=[M.l[0],M.d[0]].filter(Boolean);
   while(flex.length&&Math.abs(cal-total)>90&&guard++<6){
     const per=(cal-total)/flex.length;flex.forEach(e=>nudge(e,per));
     total=['b','s','l','d'].reduce((a,k)=>a+mealKc(M[k]),0);
   }
   meals[day]=M;
 });
 return {createdAt:todayKey(),diet,goal:p.goal,condition:cond,cal,meals};
}

 {k:'tsh',label:'TSH (thyroid)',unit:'mIU/L',flag:v=>v>4?'high':v<0.4?'low':'good',cond:'thyroid',
   tips:{high:'High (underactive thyroid) — adequate iodine (iodised salt, fish, dairy) & selenium (eggs, fish); cook goitrogenic veg; follow your doctor for medication.',low:'Low (overactive thyroid) — follow up with your doctor.'}},
 {k:'uric',label:'Uric acid',unit:'mg/dL',flag:v=>v>7?'high':'good',
   tips:{high:'High — limit organ meat, red meat & alcohol; stay well hydrated; moderate high-purine foods.'}},
 {k:'sbp',label:'Blood pressure (systolic)',unit:'mmHg',flag:v=>v>=140?'high':v>=130?'warn':'good',

function healthCfg(){if(!DB.health)DB.health={vals:{},updatedAt:null};if(!DB.health.vals)DB.health.vals={};return DB.health;}
function flagColor(f){return f==='good'?'var(--good)':f==='warn'?'var(--warn)':'var(--bad)';}
function flagLabel(f){return f==='good'?'Normal':f==='warn'?'Borderline':f==='high'?'High':f==='low'?'Low':'—';}
function healthFlags(){const H=healthCfg();return MARKERS.map(m=>{const v=H.vals[m.k];if(v==null)return null;return {m,v,f:m.flag(v)};}).filter(Boolean);}

function readReportFile(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,image/*';
 inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
   if(f.type==='application/pdf'){toast('Reading PDF…');try{const text=await pdfExtract(f);const found=parseReport(text);fillHealthInputs(found);toast(Object.keys(found).length?'Found '+Object.keys(found).length+' values — please check them':'No values auto-found — enter manually');}catch(e){toast('Could not read this PDF — enter values manually');}}
   else{toast('For a photo, please type the values in below.');}

 inp.click();

async function pdfExtract(file){
 const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.mjs');
 pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.mjs';
 const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
 let text='';for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();text+=' '+c.items.map(it=>it.str).join(' ');}
 return text;
}
function parseReport(text){
 const t=(text||'').toLowerCase().replace(/\s+/g,' '),out={};
 const g=re=>{const m=t.match(re);return m?parseFloat(m[1]):null;};
 [['sugar',/(?:fasting (?:blood )?(?:sugar|glucose)|fbs|glucose fasting)[^0-9]{0,20}(\d{2,3}(?:\.\d+)?)/],
  ['hba1c',/hba1c[^0-9]{0,15}(\d{1,2}\.\d)/],['chol',/total cholesterol[^0-9]{0,20}(\d{2,3})/],
  ['ldl',/ldl[^0-9]{0,20}(\d{2,3})/],['hdl',/hdl[^0-9]{0,20}(\d{2,3})/],['trig',/triglycerid[es]{1,3}[^0-9]{0,20}(\d{2,3})/],
  ['vitd',/(?:vitamin d|25[- ]?oh)[^0-9]{0,25}(\d{1,3}(?:\.\d+)?)/],['b12',/b[\s-]?12[^0-9]{0,20}(\d{2,4})/],
  ['hb',/(?:haemoglobin|hemoglobin|hb)[^0-9]{0,15}(\d{1,2}\.\d)/],['tsh',/tsh[^0-9]{0,15}(\d{1,2}\.\d+)/],
  ['uric',/uric acid[^0-9]{0,15}(\d\.\d+)/],['sbp',/(?:blood pressure|bp)[^0-9]{0,10}(\d{2,3})\s*\/\s*\d{2,3}/]
 ].forEach(([k,re])=>{const v=g(re);if(v!=null)out[k]=v;});
 return out;
}
function fillHealthInputs(found){MARKERS.forEach(m=>{if(found[m.k]!=null){const el=document.getElementById('hv-'+m.k);if(el)el.value=found[m.k];}});}
function applyHealthToPlan(){
 const conds=new Set();healthFlags().forEach(x=>{if(x.f!=='good'&&x.m.cond)conds.add(x.m.cond);});
 const p=P();let applied='';
 if(conds.has('diabetes')){p.condition='diabetes';applied='Diabetes';}
 else if(conds.has('thyroid')){p.condition='thyroid';applied='Thyroid';}
 if(!applied)return toast('No special diet mode needed from these values');
 if(p.autoTargets)p.targets=computeTargets(p);
 if(p.genPlan)p.genPlan=generateWeek(p);

}

/* ---------- backup & data safety (no server) ---------- */
function backupJSON(){return JSON.stringify(DB);}
function downloadBackup(){
 try{
   const url=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
   const a=document.createElement('a');a.href=url;a.download='wellora-backup-'+todayKey()+'.json';
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
   toast('Backup file saved 📄');
 }catch(e){toast('Could not save file');}
}
function restoreFromFile(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
 inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
   r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.profiles)throw 0;DB=o;save();updateChip();renderAll();toast('Data restored ✅');}catch(e){toast('Invalid backup file');}};
   r.readAsText(f);};
 inp.click();
}
/* File System Access auto-backup (Chrome desktop / Android only) */
function fsaSupported(){return typeof window!=='undefined' && 'showSaveFilePicker' in window;}
function idbOpen(){return new Promise(res=>{try{const o=indexedDB.open('wellora-kv',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>res(o.result);o.onerror=()=>res(null);}catch(e){res(null);}});}
async function idbSet(k,v){const db=await idbOpen();if(!db)return;return new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
async function idbGet(k){const db=await idbOpen();if(!db)return null;return new Promise(res=>{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);});}
async function enableAutoBackup(){
 if(!fsaSupported())return toast('Auto-save needs Chrome or an Android phone');
 try{
   const h=await window.showSaveFilePicker({suggestedName:'wellora-backup.json',types:[{description:'Wellora backup',accept:{'application/json':['.json']}}]});
   fsHandle=h;await idbSet('fsHandle',h);DB.autoBackup=true;save();await fsWrite();toast('Auto-backup on 🔒');renderProfile();
 }catch(e){/* user cancelled */}
}
function disableAutoBackup(){fsHandle=null;idbSet('fsHandle',null);DB.autoBackup=false;save();renderProfile();toast('Auto-backup off');}
async function fsWrite(){if(!fsHandle)return;try{const w=await fsHandle.createWritable();await w.write(backupJSON());await w.close();}catch(e){}}
async function fsRestore(){
 if(!fsaSupported())return toast('Use Restore from file instead');
 try{if(!fsHandle){const [h]=await window.showOpenFilePicker({types:[{description:'Wellora backup',accept:{'application/json':['.json']}}]});fsHandle=h;await idbSet('fsHandle',h);}
   if(fsHandle.requestPermission){const perm=await fsHandle.requestPermission({mode:'readwrite'});if(perm!=='granted')return toast('Permission needed');}
   const f=await fsHandle.getFile();const o=JSON.parse(await f.text());if(!o||!o.profiles)throw 0;DB=o;DB.autoBackup=true;save();updateChip();renderAll();toast('Loaded from backup file ✅');
 }catch(e){toast('Could not read the file');}
}
let fsTimer=null;
function scheduleFsWrite(){if(!fsHandle||!DB.autoBackup)return;clearTimeout(fsTimer);fsTimer=setTimeout(fsWrite,3000);}
async function loadFsHandle(){try{const h=await idbGet('fsHandle');if(h)fsHandle=h;}catch(e){}}
async function requestPersist(){try{if(navigator.storage&&navigator.storage.persist){const p=await navigator.storage.persisted();if(!p)await navigator.storage.persist();}}catch(e){}}

/* ---------- passcode lock ---------- */
function authEnabled(){return !!(DB.auth&&DB.auth.pin);}
async function hashPin(p){
 try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wellora:'+p));
   return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
 catch(e){let h=5381;for(const c of p)h=((h*33)^c.charCodeAt(0))>>>0;return 'f'+h;}
}
let lockBuf='';
function showLock(){
 if(document.getElementById('lockscreen'))return;
 lockBuf='';
 const o=el('div');o.id='lockscreen';
 o.innerHTML=`<div class="lock-inner">
   <div class="splash-logo" style="width:74px;height:74px;border-radius:21px;animation:none;box-shadow:none"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.33-9.02C1.1 8.87 2.7 5.5 6 5.5c2 0 3.2 1.2 4 2.5.8-1.3 2-2.5 4-2.5 3.3 0 4.9 3.37 3.33 6.48C19 16.65 12 21 12 21Z" fill="#fff"/></svg></div>
   <div class="lock-title">Enter your passcode</div>
   <div class="lock-dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockKey('${n}')">${n}</button>`).join('')}
     <span></span><button onclick="lockKey('0')">0</button><button class="kp-del" onclick="lockDel()">⌫</button></div>
 </div>`;
 document.body.appendChild(o);
}
function updDots(){const d=document.getElementById('lockDots');if(d)[...d.children].forEach((c,i)=>c.classList.toggle('on',i<lockBuf.length));}
async function lockKey(n){
 if(lockBuf.length>=4)return;lockBuf+=n;updDots();
 if(lockBuf.length===4){
   const h=await hashPin(lockBuf),o=document.getElementById('lockscreen');
   if(h===DB.auth.pin){o.style.transition='opacity .3s';o.style.opacity='0';setTimeout(()=>o.remove(),300);}
   else{o.classList.add('shake');lockBuf='';updDots();setTimeout(()=>o.classList.remove('shake'),400);}
 }
}
function lockDel(){lockBuf=lockBuf.slice(0,-1);updDots();}
function toggleLock(){
 if(authEnabled()){
   openModal(`<div class="modal-head"><h3>Turn off passcode?</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>

}
function disableLock(){delete DB.auth;save();closeModal();renderProfile();toast('App lock turned off');}
function setPinModal(){
 openModal(`<div class="modal-head"><h3>Set a 4-digit passcode</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  <div class="field"><label>New passcode</label><input class="input" id="pin1" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:10px;text-align:center;font-size:22px"></div>
  <div class="field"><label>Confirm passcode</label><input class="input" id="pin2" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:10px;text-align:center;font-size:22px"></div>
  <button class="btn block" onclick="savePin()">Enable lock</button>
  <p class="faint" style="font-size:11.5px;margin-top:10px">Tip: there's no passcode recovery — if you forget it you'll need to clear the app's data. Keep a backup (Profile → Data).</p>`);

async function savePin(){

 if(!/^\d{4}$/.test(a))return toast('Enter exactly 4 digits');
 if(a!==b)return toast('Passcodes do not match');
 DB.auth={pin:await hashPin(a)};save();closeModal();renderProfile();toast('App lock enabled 🔒');

let _updReg=null;

/* ---------- reminders (foreground, use-case aware) ---------- */
const REM_DEFAULTS={water:false,waterEvery:2,meals:false,weighin:false,weighinTime:'07:30',move:false,moveTime:'18:00',targets:false,targetsTime:'21:00'};
function remindersCfg(){if(!DB.reminders)DB.reminders={};for(const k in REM_DEFAULTS)if(DB.reminders[k]===undefined)DB.reminders[k]=REM_DEFAULTS[k];return DB.reminders;}
function anyReminderOn(){const r=remindersCfg();return r.water||r.meals||r.weighin||r.move||r.targets;}
let reminderTimer=null,remFired={};
function startReminders(){clearInterval(reminderTimer);reminderTimer=setInterval(checkReminders,60000);checkReminders();}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function checkReminders(){
 if(needsOnboarding()||!anyReminderOn())return;
 const r=remindersCfg(),now=new Date(),hm=hhmm(now),tk=todayKey();
 if(r.weighin&&hm===r.weighinTime)fireReminder('weighin-'+tk,'⚖️ Morning weigh-in',"Log today's weight to track your trend.");
 if(r.meals){
   if(hm==='08:30')fireReminder('bf-'+tk,'🍳 Breakfast time','Log your breakfast in Wellora.');
   if(hm==='13:00')fireReminder('ln-'+tk,'🍛 Lunch time','Log your lunch in Wellora.');
   if(hm==='20:00')fireReminder('dn-'+tk,'🌙 Dinner time','Log your dinner in Wellora.');
 }
 if(r.water){const h=now.getHours();if(h>=8&&h<=22&&now.getMinutes()===0&&(h-8)%(r.waterEvery||2)===0)fireReminder('water-'+tk+'-'+h,'💧 Water break','Have a glass of water to hit your goal.');}
 if(r.move&&hm===r.moveTime){const c=dayCtx();const left=Math.max(0,(c.t.steps||0)-(c.d.steps||0));if(left>500)fireReminder('move-'+tk,'👟 '+fmtK(left)+' steps to go','A short walk will get you to your goal today.');}
 if(r.targets&&hm===r.targetsTime){const m=targetsSummary();if(m)fireReminder('targets-'+tk,"🎯 Today's check-in",m);}
}
function dayCtx(){const p=P(),t=activeTargets(p),d=dayLog(p.id,todayKey());return {p,t,d};}
function targetsSummary(){
 const c=dayCtx(),tot=dayTotals(c.d),t=c.t,d=c.d,parts=[];
 const calLeft=t.cal-(tot.kc-(d.exercise||0));
 if(calLeft>150)parts.push(calLeft+' kcal left');else if(calLeft<-150)parts.push(Math.abs(calLeft)+' kcal over');
 const pLeft=t.protein-tot.p;if(pLeft>15)parts.push(pLeft+'g protein');
 const wLeft=(t.water||2500)-(d.water||0);if(wLeft>250)parts.push(Math.round(wLeft/250)+' glasses water');
 const sLeft=(t.steps||0)-(d.steps||0);if(sLeft>1000)parts.push(fmtK(sLeft)+' steps');
 if(!parts.length)return "You've hit your targets today — great work! 🎉";
 return 'Still to go: '+parts.slice(0,3).join(', ')+'.';
}
function fireReminder(key,title,body){
 if(remFired[key])return;remFired[key]=1;
 try{if('Notification' in window&&Notification.permission==='granted'){new Notification(title,{body,icon:'icons/icon-192.png',tag:key,badge:'icons/icon-192.png'});return;}}catch(e){}
 toast(title);
}
function toggleReminder(kind){

 if(r[kind]&&'Notification' in window&&Notification.permission==='default'){Notification.requestPermission().then(()=>renderProfile());}
 startReminders();renderProfile();
}
function setReminderTime(kind,v){remindersCfg()[kind]=v;save();}
function setWaterEvery(v){remindersCfg().waterEvery=clamp(+v||2,1,6);save();renderProfile();}

   <div style="flex:1;min-width:0"><div class="tl">${title}</div>${sub?`<div class="ts">${sub}</div>`:''}</div>
   <div class="tv">${on?extra:''}<button class="btn ${on?'':'ghost'} sm" style="${on?'background:var(--good);color:#fff':''}" onclick="toggleReminder('${kind}')">${on?'On':'Off'}</button></div></div>`;
}
function remTime(kind,val){return `<input type="time" class="input" style="width:112px;padding:7px 8px" value="${val}" onchange="setReminderTime('${kind}',this.value)">`;}
