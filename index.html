<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0f6e63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1512" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wellora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Wellora</title>
<meta name="description" content="Wellora By Adesh — personal Indian health & nutrition tracker">
<style>
  html{-webkit-text-size-adjust:100%;color-scheme:light dark}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f4f7f4; --border:#dce4df;
  --ink:#14231f; --ink-soft:#4d5e58; --ink-faint:#7d8d87;
  --primary:#0f6e63; --primary-soft:#d5eae5; --primary-ink:#0a473f;
  --accent:#e0812f; --accent-soft:#fbe6cf;
  --good:#2f9e6b; --good-soft:#d7efe2;
  --warn:#d99a17; --warn-soft:#faeccb;
  --bad:#d95948; --bad-soft:#f8ddd7;
  --info:#3b7dd8; --info-soft:#dbe8fb;
  --ring-track:#e6ece9;
  --shadow:0 1px 2px rgba(20,35,31,.05),0 8px 24px -12px rgba(20,35,31,.18);
  --shadow-sm:0 1px 2px rgba(20,35,31,.06);
  --r:16px; --r-sm:11px;
  --nav-h:64px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:'Bricolage Grotesque',var(--font);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0d1512; --surface:#16211d; --surface-2:#1c2925; --border:#2a3833;
    --ink:#e8f0ec; --ink-soft:#a9b8b2; --ink-faint:#7a8a84;
    --primary:#3fb8a6; --primary-soft:#153029; --primary-ink:#8fe6d8;
    --accent:#f0a05a; --accent-soft:#3a2a17;
    --good:#4cc088; --good-soft:#153427;
    --warn:#e6b23e; --warn-soft:#352a12;
    --bad:#ec7361; --bad-soft:#38201c;
    --info:#67a0ec; --info-soft:#182739;
    --ring-track:#26332e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#16211d; --surface-2:#1c2925; --border:#2a3833;
  --ink:#e8f0ec; --ink-soft:#a9b8b2; --ink-faint:#7a8a84;
  --primary:#3fb8a6; --primary-soft:#153029; --primary-ink:#8fe6d8;
  --accent:#f0a05a; --accent-soft:#3a2a17;
  --good:#4cc088; --good-soft:#153427;
  --warn:#e6b23e; --warn-soft:#352a12;
  --bad:#ec7361; --bad-soft:#38201c;
  --info:#67a0ec; --info-soft:#182739;
  --ring-track:#26332e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}
::placeholder{color:var(--ink-faint)}

/* ---- shell ---- */
.app{max-width:1040px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-left)) calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);
  padding:14px 0 10px;display:flex;align-items:center;gap:12px;}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--primary),#12876f);
  display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--shadow-sm)}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--ink-faint);margin-top:-2px;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--ink-soft);flex:none;box-shadow:var(--shadow-sm)}
.icon-btn:hover{color:var(--primary)}
.icon-btn svg{width:19px;height:19px}
.profile-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:5px 12px 5px 5px;box-shadow:var(--shadow-sm);max-width:190px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:var(--display)}
.profile-chip .pname{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-chip svg{width:15px;height:15px;color:var(--ink-faint);flex:none}

main{flex:1;padding-top:6px}
.tab-pane{display:none;animation:fade .25s ease}
.tab-pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- nav ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:1040px;margin:0 auto;height:var(--nav-h);display:flex;padding:0 8px}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-faint);font-size:11px;font-weight:700;border-radius:12px;transition:color .15s}
.tab-btn svg{width:23px;height:23px}
.tab-btn.active{color:var(--primary)}
.tab-btn.active .tb-ic{background:var(--primary-soft)}
.tb-ic{width:52px;height:30px;border-radius:16px;display:grid;place-items:center;transition:background .18s}

/* ---- generic cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.section-title{display:flex;align-items:center;gap:8px;margin:22px 0 12px;font-size:13px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.section-title .line{height:1px;background:var(--border);flex:1}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.pri{background:var(--primary-soft);color:var(--primary-ink)}

/* ---- hero / dashboard ---- */
.hero{background:linear-gradient(150deg,var(--primary),#0c5a50);color:#eafaf6;border:none}
.hero h2{color:#fff}
.hero .sub{color:#b9e2da}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.hero .goaltag{background:rgba(255,255,255,.16);color:#fff;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700}
.progress-line{height:9px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.progress-line>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f4b06a);border-radius:6px}
.wl-row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:#d3efe8;font-weight:600}
.wl-row b{color:#fff}

.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.rings{grid-template-columns:repeat(2,1fr)}}
.ring-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.ring-wrap{position:relative;width:84px;height:84px;margin:0 auto 6px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring-center b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.ring-center small{font-size:10px;color:var(--ink-faint);font-weight:700}
.ring-label{font-size:12px;font-weight:700;color:var(--ink-soft)}
.ring-sub{font-size:11px;color:var(--ink-faint);font-weight:600}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.stat-grid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.stat .k{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-family:var(--display);font-size:23px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:12px;font-weight:600;color:var(--ink-faint);font-family:var(--font)}

/* BMI meter */
.bmi-meter{height:12px;border-radius:8px;margin:14px 0 6px;position:relative;
  background:linear-gradient(90deg,#3b7dd8 0 22%,#2f9e6b 22% 40%,#d99a17 40% 60%,#e0812f 60% 78%,#d95948 78% 100%)}
.bmi-knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);
  transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.bmi-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;
  font-weight:700;font-size:14px;background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.btn.accent{background:var(--accent)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn svg{width:17px;height:17px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.input,select.input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-soft);min-width:70px}
.seg button.on{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}

/* food diary */
.meal-block{margin-bottom:14px}
.meal-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.meal-head .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.meal-head b{font-size:14px}
.meal-head .kc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.food-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.food-item:first-child{border-top:none}
.food-item .fn{font-weight:600;font-size:14px}
.food-item .fm{font-size:11px;color:var(--ink-faint);font-weight:600}
.food-item .fk{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.food-item .del{color:var(--ink-faint);width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.food-item .del:hover{color:var(--bad);background:var(--bad-soft)}
.add-food{display:flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:13px;padding:8px 0}
.add-food svg{width:17px;height:17px}
.macro-bar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:4px;background:var(--surface-2)}
.macro-bar i{display:block;height:100%}

/* tracker rows */
.track-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.track-row:first-child{border-top:none}
.track-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.track-ic svg{width:20px;height:20px}
.track-row .tl{font-weight:700;font-size:14px}
.track-row .ts{font-size:12px;color:var(--ink-faint);font-weight:600}
.track-row .tv{margin-left:auto;display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.stepper button{width:34px;height:36px;font-size:18px;font-weight:700;color:var(--primary);display:grid;place-items:center}
.stepper input{width:56px;text-align:center;border:none;background:transparent;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.stepper.wide input{width:72px}

/* checklist */
.check{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border);cursor:pointer}
.check:first-child{border-top:none}
.check .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex:none;display:grid;place-items:center;transition:.15s}
.check .box svg{width:15px;height:15px;color:#fff;opacity:0}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box svg{opacity:1}
.check.on .ctxt{color:var(--ink-faint);text-decoration:line-through}
.ctxt{font-weight:600;font-size:14px}

/* charts */
.chart-wrap{overflow-x:auto}
svg.chart text{fill:var(--ink-faint);font-family:var(--font);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* meal plan */
.day-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.day-tab{flex:none;padding:9px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
  font-weight:700;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow-sm)}
.day-tab.on{background:var(--primary);color:#fff;border-color:transparent}
.plan-meal{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.plan-meal:first-child{border-top:none}
.plan-meal .pm-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.plan-meal .pm-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint)}
.plan-meal .pm-d{font-weight:600;font-size:14px;margin-top:1px}
.seed-note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;
  color:var(--ink);display:flex;gap:10px;align-items:center}
.seed-note .s-ic{font-size:20px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,20,17,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:auto}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
@media(min-width:640px){.modal{border-radius:20px;transform:translateY(20px)}}
.modal-bg.show .modal{transform:none}
.modal h3{font-size:19px;margin-bottom:4px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-close{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft)}
.chip-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fchip{padding:8px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  font-size:13px;font-weight:700;display:flex;flex-direction:column;line-height:1.15}
.fchip small{font-weight:600;color:var(--ink-faint);font-size:10px}
.fchip:hover{border-color:var(--primary);color:var(--primary)}
.search-list{max-height:230px;overflow-y:auto;margin-top:8px}
.sr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;cursor:pointer}
.sr:hover{background:var(--surface-2)}
.sr .srn{font-weight:700;font-size:14px}
.sr .srm{font-size:11px;color:var(--ink-faint);font-weight:600}
.sr .srk{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:26px 16px;color:var(--ink-faint)}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:24px;font-weight:700;font-size:13px;z-index:200;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}
.toast.show{opacity:1}
.sample-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--warn);
  background:var(--warn-soft);padding:3px 9px;border-radius:20px}
.disclaimer{font-size:11.5px;color:var(--ink-faint);line-height:1.5;margin-top:10px;padding:11px 13px;
  background:var(--surface-2);border-radius:11px;border:1px solid var(--border)}
a.link{color:var(--primary);font-weight:700;text-decoration:none}

/* ===== Wellora polish layer ===== */
.card{transition:box-shadow .22s ease,transform .22s ease}
.tab-pane.active .card{animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.tab-pane.active .rings>*{animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.tab-pane.active .rings>*:nth-child(1){animation-delay:.02s}
.tab-pane.active .rings>*:nth-child(2){animation-delay:.08s}
.tab-pane.active .rings>*:nth-child(3){animation-delay:.14s}
.tab-pane.active .rings>*:nth-child(4){animation-delay:.20s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.ring-card{transition:transform .2s ease,box-shadow .2s ease}
.ring-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ring-wrap svg circle:last-of-type{transition:stroke-dashoffset 1s cubic-bezier(.34,1.05,.4,1)}
.ring-center b{letter-spacing:-.02em}

.btn{transition:filter .15s ease,transform .12s ease,box-shadow .15s ease}
.btn:hover{box-shadow:var(--shadow)}
.btn:active,.icon-btn:active,.day-tab:active,.fchip:active,.stepper button:active,.tab-btn:active{transform:translateY(1px) scale(.97)}
.icon-btn,.day-tab,.fchip,.profile-chip{transition:transform .12s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
.profile-chip:hover{box-shadow:var(--shadow)}
.tb-ic svg{transition:transform .22s cubic-bezier(.34,1.4,.5,1)}
.tab-btn.active .tb-ic svg{transform:scale(1.12)}

.hero{position:relative;overflow:hidden}

/* ---------- profile / log helpers ---------- */
function P(){return DB.profiles.find(p=>p.id===DB.active)||DB.profiles[0];}
function logsFor(pid){if(!DB.logs[pid])DB.logs[pid]={};return DB.logs[pid];}
function dayLog(pid,key){const L=logsFor(pid);if(!L[key])L[key]={foods:[],water:0,steps:0,exercise:0,weight:null,sleep:0,habits:{}};
 const d=L[key];d.foods=d.foods||[];d.habits=d.habits||{};return d;}
function today(){return dayLog(DB.active,todayKey());}

function bmr(p,wt){const s=p.sex==='male'?5:-161;return 10*wt+6.25*p.height-5*p.age+s;}
function currentWeight(pid){const L=logsFor(pid);const keys=Object.keys(L).filter(k=>L[k].weight!=null).sort();
 if(keys.length)return L[keys[keys.length-1]].weight;return P().startWeight;}
function bmiVal(wt,h){return wt/((h/100)**2);}
function bmiCat(b){ // Asian-Indian cutoffs
 if(b<18.5)return{t:'Underweight',c:'info',p:(b/18.5)*22};
 if(b<23)return{t:'Healthy',c:'good',p:22+((b-18.5)/4.5)*18};
 if(b<25)return{t:'Overweight',c:'warn',p:40+((b-23)/2)*20};
 if(b<30)return{t:'Obese I',c:'bad',p:60+((b-25)/5)*18};
 return{t:'Obese II',c:'bad',p:clamp(78+((b-30)/5)*22,78,100)};}

function computeTargets(p){
 const wt=currentWeight(p.id);
 const tdee=bmr(p,wt)*p.activity;
 let cal,pf;
 if(p.goal==='lose'){cal=tdee-500;pf=1.9;}
 else if(p.goal==='gain'){cal=tdee+350;pf=1.8;}
 else if(p.goal==='strength'){cal=tdee+150;pf=2.0;}
 else {cal=tdee;pf=1.7;}
 cal=Math.max(1200,Math.round(cal/10)*10);
 const protein=Math.round(wt*pf);
 const fat=Math.round(cal*0.27/9);
 const carb=Math.round((cal-protein*4-fat*9)/4);
 return {cal,protein,carb,fat,fiber:Math.round(cal/1000*14),water:Math.round(wt*35/50)*50,
   steps:p.goal==='gain'?7000:9000,sleep:8};
}
function activeTargets(p){return p.autoTargets?computeTargets(p):p.targets;}

function dayTotals(d){let kc=0,p=0,c=0,f=0;(d.foods||[]).forEach(x=>{kc+=x.kc;p+=x.p;c+=x.c;f+=x.f;});
 return {kc:Math.round(kc),p:Math.round(p),c:Math.round(c),f:Math.round(f)};}

function ringSVG(pct,color,size=84){
 const r=(size-12)/2, C=2*Math.PI*r, off=C*(1-clamp(pct,0,1));
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="9"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
   stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}
function ringCard(label,val,unit,pct,color,sub){
 return `<div class="ring-card"><div class="ring-wrap">${ringSVG(pct,color)}
   <div class="ring-center"><b class="tnum">${val}</b><small>${unit}</small></div></div>
   <div class="ring-label">${label}</div><div class="ring-sub tnum">${sub}</div></div>`;
}

function animateDash(){
 const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 document.querySelectorAll('#pane-dash .ring-card').forEach(card=>{
   const circ=card.querySelector('svg circle:last-of-type');
   if(circ&&!rm){
     const off=circ.getAttribute('stroke-dashoffset'), dash=circ.getAttribute('stroke-dasharray');
     circ.style.transition='none';circ.setAttribute('stroke-dashoffset',dash);
     requestAnimationFrame(()=>requestAnimationFrame(()=>{circ.style.transition='';circ.setAttribute('stroke-dashoffset',off);}));
   }
 });
 if(rm)return;
 document.querySelectorAll('#pane-dash .ring-center b').forEach(countUp);
}
function countUp(node){
 const raw=node.textContent.trim();
 const num=parseFloat(raw.replace(/[^\d.-]/g,''));
 if(isNaN(num)||num===0){return;}
 const suffix=raw.replace(/[\d.\-]/g,'');
 const dec=(raw.split('.')[1]||'').replace(/\D/g,'').length;
 const dur=750,t0=performance.now();
 function step(t){
   const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
   node.textContent=(num*e).toFixed(dec)+suffix;
   if(p<1)requestAnimationFrame(step); else node.textContent=raw;
 }
 requestAnimationFrame(step);
}

/* ---------- NUTRIENTS (micronutrients) ---------- */
function dayMicros(d){
 const tot={};NUTRIENTS.forEach(n=>tot[n.k]=0);
 (d.foods||[]).forEach(f=>{const m=MICRO[f.n];if(!m)return;const q=f.qty||1;
   for(const k in m)if(k in tot)tot[k]+=m[k]*q;});
 return tot;
}
function microRda(n,t){return n.k==='fib'?(t.fiber||32):n.rda;}
function microCovered(mic,t){return NUTRIENTS.filter(n=>mic[n.k]/microRda(n,t)>=0.7).length;}
function fmtMicro(v){return v>=100?Math.round(v):v>=10?Math.round(v):round(v,1);}
function renderNutrients(){
 const p=P(),t=activeTargets(p),d=today();
 const mic=dayMicros(d);
 const covered=microCovered(mic,t);
 const strong=NUTRIENTS.filter(n=>mic[n.k]/microRda(n,t)>=1).length;
 const unrec=(d.foods||[]).filter(f=>!MICRO[f.n]).length;

 let h=`<div class="section-title" style="margin-top:14px">Micronutrients today<span class="line"></span>
   <span class="pill ${covered>=11?'good':covered>=7?'warn':'bad'}">${covered}/${NUTRIENTS.length} on track</span></div>`;
 h+=`<div class="card"><div style="display:flex;gap:15px;align-items:center">
   <div class="ring-wrap" style="width:78px;height:78px;flex:none">${ringSVG(covered/NUTRIENTS.length,'var(--primary)',78)}
     <div class="ring-center"><b class="tnum" style="font-size:18px">${covered}</b><small>/${NUTRIENTS.length}</small></div></div>
   <div><div style="font-family:var(--display);font-weight:800;font-size:17px">${strong} fully met · ${covered} on track</div>
   <div class="faint" style="font-size:13px;font-weight:600;margin-top:2px">Estimated from today's logged foods, vs daily targets. Aim to cover most across the week.</div></div></div>`;

 ['Vitamins','Minerals','Fats & fiber'].forEach(g=>{
   h+=`<div class="section-title">${g}<span class="line"></span></div><div class="card">`;
   NUTRIENTS.filter(n=>n.g===g).forEach(n=>{
     const have=mic[n.k],need=microRda(n,t),r=need?have/need:0;
     const col=r>=0.7?'var(--good)':r>=0.4?'var(--warn)':'var(--bad)';
     h+=`<div class="nutri-row"><div class="nutri-top"><b>${n.n}</b>
        <span class="tnum">${fmtMicro(have)} / ${fmtMicro(need)} ${n.u} · ${Math.round(r*100)}%</span></div>
       <div class="nbar"><i style="width:${clamp(r*100,0,100)}%;background:${col}"></i></div>
       <div class="nutri-src faint">Best from: ${n.src}</div></div>`;
   });
   h+=`</div>`;
 });
 if(unrec)h+=`<div class="disclaimer">${unrec} logged item${unrec>1?'s':''} (custom or planned meals) have no micronutrient estimate yet, so they're not counted above — log them from the food search to include their nutrients.</div>`;
 h+=`<div class="disclaimer">🔬 Micronutrient amounts are practical per-serving estimates from each dish's main ingredients — for coverage awareness, not lab-exact values. A varied weekly diet is the goal, not hitting every number every day. Deficiencies (e.g. vitamin&nbsp;D, B12) need a clinician.</div>`;
 $('#pane-nutri').innerHTML=h;
 requestAnimationFrame(()=>{
   if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
   document.querySelectorAll('#pane-nutri .nbar i').forEach(i=>{const w=i.style.width;i.style.width='0';
     requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.transition='width .8s cubic-bezier(.2,.8,.2,1)';i.style.width=w;}));});
 });

function lastNDays(n){const a=[];for(let i=n-1;i>=0;i--)a.push(fmtKey(addDays(new Date(),-i)));return a;}
function lineChart(pts,goal){
 const W=Math.max(320,pts.length*46),H=200,pad={l:34,r:14,t:16,b:26};
 const xs=pts.map(p=>p.x.getTime());
 const minX=Math.min(...xs),maxX=Math.max(...xs);
 const ws=pts.map(p=>p.w).concat([goal]);
 let minW=Math.min(...ws)-0.6,maxW=Math.max(...ws)+0.6;
 const X=t=>pad.l+(maxX===minX?0.5:(t-minX)/(maxX-minX))*(W-pad.l-pad.r);
 const Y=w=>pad.t+(1-(w-minW)/(maxW-minW))*(H-pad.t-pad.b);
 let g='';
 // gridlines
 for(let i=0;i<=3;i++){const w=minW+(maxW-minW)*i/3,y=Y(w);
   g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
   <text x="4" y="${y+4}" font-size="10">${round(w,1)}</text>`;}
 // goal line
 const gy=Y(goal);g+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="${W-pad.r}" y="${gy-5}" font-size="10" text-anchor="end" fill="var(--accent)">goal ${goal}</text>`;
 // area + line
 const dpath=pts.map((p,i)=>(i?'L':'M')+X(p.x.getTime()).toFixed(1)+' '+Y(p.w).toFixed(1)).join(' ');
 const area=dpath+` L ${X(maxX).toFixed(1)} ${H-pad.b} L ${X(minX).toFixed(1)} ${H-pad.b} Z`;
 g+=`<path d="${area}" fill="var(--primary-soft)" opacity=".6"/><path d="${dpath}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>{const last=i===pts.length-1;
   g+=`<circle cx="${X(p.x.getTime())}" cy="${Y(p.w)}" r="${last?4.5:3}" fill="${last?'var(--primary)':'var(--surface)'}" stroke="var(--primary)" stroke-width="2"/>`;
   if(i===0||last||i===pts.length-1)g+=`<text x="${X(p.x.getTime())}" y="${H-8}" font-size="9" text-anchor="middle">${p.x.getDate()}/${p.x.getMonth()+1}</text>`;});
 return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function calChart(p,L){
 const t=activeTargets(p);const days=lastNDays(7);
 const rows=days.map(k=>{const d=L[k]||{};return{k,eaten:dayTotals(d).kc,burn:d.exercise||0,x:parseKey(k)};});
 const W=Math.max(320,days.length*44),H=190,pad={l:34,r:12,t:14,b:26};
 const maxV=Math.max(t.cal*1.15,...rows.map(r=>r.eaten),1);
 const Y=v=>pad.t+(1-v/maxV)*(H-pad.t-pad.b);
 const bw=(W-pad.l-pad.r)/days.length*0.5;
 let g='';
 for(let i=0;i<=2;i++){const v=maxV*i/2,y=Y(v);g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)"/><text x="4" y="${y+4}" font-size="10">${Math.round(v)}</text>`;}
 const ty=Y(t.cal);g+=`<line x1="${pad.l}" y1="${ty}" x2="${W-pad.r}" y2="${ty}" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
 rows.forEach((r,i)=>{const cx=pad.l+(i+0.5)*((W-pad.l-pad.r)/days.length);
   const y=Y(r.eaten),bh=(H-pad.b)-y;
   const col=r.eaten>t.cal?'var(--bad)':'var(--accent)';
   if(r.eaten>0)g+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="3" fill="${col}"/>`;
   if(r.burn>0){const by=Y(r.burn);g+=`<rect x="${cx-bw/2}" y="${by}" width="${bw}" height="${(H-pad.b)-by}" rx="3" fill="var(--good)" opacity=".55"/>`;}
   g+=`<text x="${cx}" y="${H-8}" font-size="9" text-anchor="middle">${DOW[r.x.getDay()]}</text>`;});
 return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

   const on=pr.id===DB.active;
   h+=`<div class="track-row" onclick="switchProfile('${pr.id}')" style="cursor:pointer">
     <span class="avatar" style="width:38px;height:38px;font-size:15px">${initials(pr.name)}</span>
     <div><div class="tl">${esc(pr.name)} ${on?'<span class="pill pri" style="margin-left:4px">active</span>':''}</div>
     <div class="ts">${GOALS[pr.goal].icon} ${GOALS[pr.goal].label} · ${pr.goalWeight} kg goal</div></div>
     <div class="tv"><button class="icon-btn" onclick="event.stopPropagation();editProfile('${pr.id}')"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10l-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 7l4 4" stroke="currentColor" stroke-width="1.8"/></svg></button></div></div>`;
 });
 h+=`<button class="btn ghost block" style="margin-top:12px" onclick="editProfile(null)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add profile</button></div>`;

 // current profile details + targets
 const t=activeTargets(p);
 h+=`<div class="section-title">${esc(p.name)}'s details<span class="line"></span></div>
   <div class="card">
   <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
     <div class="stat"><div class="k">Age</div><div class="v tnum">${p.age}</div></div>
     <div class="stat"><div class="k">Height</div><div class="v tnum">${p.height}<small>cm</small></div></div>
     <div class="stat"><div class="k">Weight</div><div class="v tnum">${round(wt,1)}<small>kg</small></div></div>
   </div>
   <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
     <div class="stat"><div class="k">BMR</div><div class="v tnum">${Math.round(bmr(p,wt))}</div></div>
     <div class="stat"><div class="k">Maintenance</div><div class="v tnum">${Math.round(bmr(p,wt)*p.activity)}</div></div>
     <div class="stat"><div class="k">Target kcal</div><div class="v tnum">${t.cal}</div></div>
   </div>
   <button class="btn block" style="margin-top:14px" onclick="editProfile('${p.id}')">Edit profile & goals</button>
   </div>`;

 // targets
 h+=`<div class="section-title">Daily targets ${p.autoTargets?'<span class="pill info" style="margin-left:6px">auto</span>':'<span class="pill pri" style="margin-left:6px">custom</span>'}<span class="line"></span></div>
  <div class="card"><div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
   <div class="stat"><div class="k">Protein</div><div class="v tnum">${t.protein}<small>g</small></div></div>
   <div class="stat"><div class="k">Carbs</div><div class="v tnum">${t.carb}<small>g</small></div></div>
   <div class="stat"><div class="k">Fat</div><div class="v tnum">${t.fat}<small>g</small></div></div>
   <div class="stat"><div class="k">Fiber</div><div class="v tnum">${t.fiber}<small>g</small></div></div>
   <div class="stat"><div class="k">Water</div><div class="v tnum">${round(t.water/1000,1)}<small>L</small></div></div>
   <div class="stat"><div class="k">Steps</div><div class="v tnum">${fmtK(t.steps)}</div></div>
  </div></div>`;

 // data management
 h+=`<div class="section-title">Data<span class="line"></span></div><div class="card">
   <div class="btn-row">
     <button class="btn ghost sm" onclick="exportData()">⬇ Backup (copy JSON)</button>
     <button class="btn ghost sm" onclick="importData()">⬆ Restore</button>`;
 if(DB.sampleData)h+=`<button class="btn ghost sm" onclick="clearSample()">Clear sample data</button>`;
 h+=`</div><div class="faint" style="font-size:12px;margin-top:10px">Your data is stored privately in this browser. Use Backup to keep a copy or move devices.</div></div>`;

 h+=`<div class="disclaimer">Wellora is a personal wellness tracker, not a medical device. Targets use the Mifflin–St&nbsp;Jeor estimate and are starting points — review with a clinician for medical conditions.</div>`;
 $('#pane-profile').innerHTML=h;
}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';}
function switchProfile(id){DB.active=id;save();updateChip();renderAll();toast('Switched to '+P().name);closeModal();}

let editingId=null;
function editProfile(id){
 editingId=id;const p=id?DB.profiles.find(x=>x.id===id):makeProfile();
 let h=`<div class="modal-head"><h3>${id?'Edit':'New'} profile</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>`;
 h+=`<div class="field"><label>Name</label><input class="input" id="ep-name" value="${esc(p.name)}"></div>
   <div class="field"><label>Goal</label><div class="seg" id="ep-goal">
    ${Object.entries(GOALS).map(([k,v])=>`<button data-v="${k}" class="${p.goal===k?'on':''}" onclick="segPick(this,'ep-goal')">${v.icon} ${v.label}</button>`).join('')}</div></div>
   <div class="field"><label>Sex</label><div class="seg" id="ep-sex">
    <button data-v="male" class="${p.sex==='male'?'on':''}" onclick="segPick(this,'ep-sex')">Male</button>
    <button data-v="female" class="${p.sex==='female'?'on':''}" onclick="segPick(this,'ep-sex')">Female</button></div></div>
   <div class="row3"><div class="field"><label>Age</label><input class="input" id="ep-age" type="number" value="${p.age}"></div>
    <div class="field"><label>Height (cm)</label><input class="input" id="ep-height" type="number" value="${p.height}"></div>
    <div class="field"><label>Start wt (kg)</label><input class="input" id="ep-sw" type="number" step="0.1" value="${p.startWeight}"></div></div>
   <div class="row2"><div class="field"><label>Goal weight (kg)</label><input class="input" id="ep-gw" type="number" step="0.1" value="${p.goalWeight}"></div>
   <div class="field"><label>Activity</label><select class="input" id="ep-act">
     <option value="1.2" ${p.activity==1.2?'selected':''}>Sedentary</option>
     <option value="1.375" ${p.activity==1.375?'selected':''}>Light (walks)</option>
     <option value="1.55" ${p.activity==1.55?'selected':''}>Moderate</option>
     <option value="1.725" ${p.activity==1.725?'selected':''}>Active</option></select></div></div>
   <label class="check ${p.autoTargets?'on':''}" id="ep-auto" onclick="this.classList.toggle('on')" style="border:none;padding:6px 0">
     <span class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
     <span class="ctxt">Auto-calculate my calorie & macro targets</span></label>`;
 if(id&&DB.profiles.length>1)h+=`<button class="btn ghost sm" style="color:var(--bad);margin-top:6px" onclick="deleteProfile('${id}')">Delete this profile</button>`;
 h+=`<button class="btn block" style="margin-top:14px" onclick="saveProfile()">Save profile</button>`;
 openModal(h);
}
function segPick(btn,grp){$('#'+grp).querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function segVal(grp){const b=$('#'+grp+' button.on');return b?b.dataset.v:null;}
function saveProfile(){
 const name=$('#ep-name').value.trim();if(!name)return toast('Enter a name');
 const data={name,goal:segVal('ep-goal'),sex:segVal('ep-sex'),
   age:+$('#ep-age').value||30,height:+$('#ep-height').value||170,
   startWeight:+$('#ep-sw').value||70,goalWeight:+$('#ep-gw').value||65,
   activity:+$('#ep-act').value,autoTargets:$('#ep-auto').classList.contains('on')};
 if(editingId){const p=DB.profiles.find(x=>x.id===editingId);Object.assign(p,data);
   if(p.autoTargets)p.targets=computeTargets(p);}
 else{const np=makeProfile(data);np.targets=computeTargets(np);DB.profiles.push(np);DB.active=np.id;logsFor(np.id);}
 save();updateChip();renderAll();closeModal();toast('Profile saved');
}
function deleteProfile(id){
 if(DB.profiles.length<=1)return;
 DB.profiles=DB.profiles.filter(p=>p.id!==id);delete DB.logs[id];
 if(DB.active===id)DB.active=DB.profiles[0].id;
 save();updateChip();renderAll();closeModal();toast('Profile deleted');
}
function clearSample(){
 const L=logsFor('adesh');Object.keys(L).forEach(k=>{if(L[k].sample)delete L[k];});
 DB.sampleData=false;save();renderAll();toast('Sample data cleared');
}
function exportData(){
 const s=JSON.stringify(DB);
 try{navigator.clipboard.writeText(s);toast('Backup copied to clipboard');}catch(e){
  openModal(`<div class="modal-head"><h3>Backup</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
   <p class="faint" style="font-size:13px">Copy and save this text:</p><textarea class="input" style="height:180px" readonly>${esc(s)}</textarea>`);}
}
function importData(){
 openModal(`<div class="modal-head"><h3>Restore backup</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <p class="faint" style="font-size:13px;margin-bottom:8px">Paste your backup JSON:</p>
  <textarea class="input" id="impArea" style="height:180px"></textarea>
  <button class="btn block" style="margin-top:12px" onclick="doImport()">Restore</button>`);
}
function doImport(){try{const o=JSON.parse($('#impArea').value);if(!o.profiles)throw 0;DB=o;save();updateChip();renderAll();closeModal();toast('Data restored');}catch(e){toast('Invalid backup');}}

/* ---------- profile switcher (chip) ---------- */
$('#profileChip').onclick=()=>{
 let h=`<div class="modal-head"><h3>Switch profile</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>`;
 DB.profiles.forEach(pr=>{h+=`<div class="sr" onclick="switchProfile('${pr.id}')"><span class="avatar">${initials(pr.name)}</span>
   <div><div class="srn">${esc(pr.name)}</div><div class="srm">${GOALS[pr.goal].label}</div></div>
   ${pr.id===DB.active?'<span class="pill good" style="margin-left:auto">active</span>':''}</div>`;});
 h+=`<button class="btn ghost block" style="margin-top:12px" onclick="closeModal();go('profile');editProfile(null)">＋ Add profile</button>`;
 openModal(h);
};

/* ---------- modal / toast ---------- */
function openModal(html){$('#modal').innerHTML=html;$('#modalBg').classList.add('show');}
function closeModal(){$('#modalBg').classList.remove('show');}
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- nav ---------- */
let cur='dash';
function go(tab){
 cur=tab;
 document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 document.querySelectorAll('.tab-pane').forEach(pane=>pane.classList.remove('active'));
 $('#pane-'+tab).classList.add('active');
 if(tab==='dash')renderDash();else if(tab==='log')renderLog();else if(tab==='progress')renderProgress();
 else if(tab==='nutri')renderNutrients();
 else if(tab==='plan')renderPlan();else if(tab==='profile')renderProfile();
 window.scrollTo(0,0);
}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function renderAll(){renderDash();if(cur!=='dash')go(cur);}

/* ---------- theme ---------- */
function applyTheme(){
 const th=DB.theme;
 if(th)document.documentElement.setAttribute('data-theme',th);else document.documentElement.removeAttribute('data-theme');
 const dark=th==='dark'||(!th&&matchMedia('(prefers-color-scheme:dark)').matches);
 $('#themeBtn').innerHTML=dark
  ?'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
$('#themeBtn').onclick=()=>{
 const dark=DB.theme==='dark'||(!DB.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
 DB.theme=dark?'light':'dark';save();applyTheme();
};

/* ---------- chip ---------- */
function updateChip(){const p=P();$('#chipName').textContent=p.name;$('#chipAvatar').textContent=initials(p.name);
 $('#brandSub').textContent='By Adesh · '+GOALS[p.goal].label;}

/* ---------- boot ---------- */
updateChip();applyTheme();renderDash();

/* ---------- PWA install support ---------- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstallBtn();});
function showInstallBtn(){
 if(document.getElementById('installBtn'))return;
 const b=document.createElement('button');b.id='installBtn';b.className='icon-btn';
 b.title='Install app';b.setAttribute('aria-label','Install app');
 b.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 b.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;b.remove();};
 document.querySelector('header.top').insertBefore(b,document.getElementById('themeBtn'));
}
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
